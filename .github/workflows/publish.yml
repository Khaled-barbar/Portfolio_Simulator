name: Publish site

# Prices are downloaded and published from your own computer (scripts/publish_prices.bat or .sh),
# because Yahoo Finance refuses requests from GitHub's servers. This workflow only republishes the
# site when its code changes on main: it takes the new code from main and keeps the prices that are
# already on the `site` branch. It never contacts Yahoo.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Prices already published
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: site
          path: _prev

      - name: Keep the published prices
        run: |
          if [ -f _prev/data/index.json ]; then
            cp _prev/data/index.json site/data/
            if [ -f _prev/data/market.json ]; then cp _prev/data/market.json site/data/; fi
            rm -rf site/data/prices && cp -r _prev/data/prices site/data/
            echo "kept $(ls site/data/prices | wc -l) price files"
          else
            echo "no prices published yet — run scripts/publish_prices on your computer"
          fi

      - name: Publish to the site branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site code ${GITHUB_SHA::7} (prices kept)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
